ecom:
  security:
    # Jamais contacté : les tests injectent les jetons via SecurityMockMvcRequestPostProcessors.jwt()
    issuer-uri: http://localhost:1/test-issuer
    client-id: ecom-test
  notifications:
    # Les e-mails sont capturés par RecordingEmailSender
    quote-recipients: devis@example.test
  order:
    expiry-job:
      enabled: false
  payment:
    reconciliation:
      enabled: false
    providers:
      paypal:
        # base-url pointe vers le serveur WireMock (TestcontainersConfiguration)
        enabled: true
        client-id: test-client
        client-secret: test-secret
        webhook-id: test-webhook
