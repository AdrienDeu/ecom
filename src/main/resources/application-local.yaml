# Profil de développement local : PostgreSQL et Valkey démarrés automatiquement via compose.yaml
spring:
  docker:
    compose:
      lifecycle-management: start-only
  mail:
    # Mailpit (compose.yaml), interface sur http://localhost:8025
    host: localhost
    port: 1025

ecom:
  cors:
    allowed-origins:
      - http://localhost:4200
  security:
    # Serveur OIDC de test (compose.yaml) qui émet des jetons au format Cognito
    issuer-uri: http://localhost:9000/ecom
    client-id: ecom-local
  notifications:
    transport: smtp
    from: no-reply@ecom.localhost
    quote-recipients: devis@ecom.localhost

management:
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces   # Tempo (compose.yaml)
    logging:
      export:
        otlp:
          endpoint: http://localhost:3100/otlp/v1/logs # Loki (compose.yaml)

logging:
  level:
    org.ecom: debug
