# Profil de développement local : PostgreSQL et Valkey démarrés automatiquement via compose.yaml
spring:
  docker:
    compose:
      lifecycle-management: start-only

ecom:
  cors:
    allowed-origins:
      - http://localhost:4200
  security:
    # Serveur OIDC de test (compose.yaml) qui émet des jetons au format Cognito
    issuer-uri: http://localhost:9000/ecom
    client-id: ecom-local

logging:
  level:
    org.ecom: debug
