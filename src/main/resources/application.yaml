spring:
  application:
    name: ecom
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_batch_fetch_size: 50
  data:
    web:
      pageable:
        max-page-size: 100
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Images produits ; au-delà, 413 Payload Too Large
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      # Buckets exacts aux seuils des SLO (p95 < 300 ms) pour des calculs de conformité précis
      slo:
        http.server.requests: 100ms, 300ms, 1s
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    metrics:
      export:
        # Les métriques sont scrapées par Prometheus (/actuator/prometheus), pas poussées en OTLP
        enabled: false
  opentelemetry:
    resource-attributes:
      deployment.environment.name: ${ECOM_ENVIRONMENT:local}
  # Export OTLP des traces (et des logs en local) : endpoints définis par profil, aucun export sinon

springdoc:
  default-produces-media-type: application/json
  api-docs:
    path: /api/openapi
    version: openapi_3_0
  swagger-ui:
    path: /api/swagger-ui

ecom:
  cors:
    allowed-origins: []
  security:
    # Fournis par variables d'environnement en staging/prod : ECOM_SECURITY_ISSUER_URI, ECOM_SECURITY_CLIENT_ID
    issuer-uri: ${ECOM_SECURITY_ISSUER_URI:}
    client-id: ${ECOM_SECURITY_CLIENT_ID:}
  cart:
    ttl: P30D
  order:
    reservation-ttl: PT30M
    expiry-job:
      interval: PT1M
  payment:
    reconciliation:
      interval: PT5M
      # open payments untouched for this long are checked with the provider
      stale-after: PT15M
    providers:
      paypal:
        # Fournis par variables d'environnement (secrets dans Secrets Manager en staging/prod)
        enabled: ${PAYPAL_ENABLED:false}
        base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
        client-id: ${PAYPAL_CLIENT_ID:}
        client-secret: ${PAYPAL_CLIENT_SECRET:}
        webhook-id: ${PAYPAL_WEBHOOK_ID:}
        currency: EUR
        brand-name: ecom
        connect-timeout: 2s
        read-timeout: 10s
