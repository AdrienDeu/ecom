spring:
  application:
    name: ecom
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_batch_fetch_size: 50
  data:
    web:
      pageable:
        max-page-size: 100
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  api-docs:
    path: /api/openapi
  swagger-ui:
    path: /api/swagger-ui

ecom:
  cors:
    allowed-origins: []
  security:
    # Fournis par variables d'environnement en staging/prod : ECOM_SECURITY_ISSUER_URI, ECOM_SECURITY_CLIENT_ID
    issuer-uri: ${ECOM_SECURITY_ISSUER_URI:}
    client-id: ${ECOM_SECURITY_CLIENT_ID:}
  cart:
    ttl: P30D
  order:
    reservation-ttl: PT30M
    expiry-job:
      interval: PT1M
