# Environnement local. Démarré automatiquement par Spring Boot avec le profil `local`
# (spring-boot-docker-compose), ou manuellement : docker compose up -d
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ecom
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ecom
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecom -d ecom"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:9-alpine
    ports:
      - "6379:6379"
    labels:
      org.springframework.boot.service-connection: redis

  # Remplace Cognito en local : émet des jetons d'accès avec les mêmes claims (client_id, token_use, cognito:groups).
  # Issuer : http://localhost:9000/ecom — la page de login interactive permet de choisir le sub et les claims.
  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.3
    ports:
      - "9000:8080"
    environment:
      JSON_CONFIG_PATH: /config/mock-oidc.json
    volumes:
      - ./dev/mock-oidc.json:/config/mock-oidc.json:ro
    labels:
      org.springframework.boot.ignore: "true"

  prometheus:
    image: prom/prometheus:v3.7.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
      # Exemplars : lien d'un point de latence vers la trace correspondante dans Tempo
      - --enable-feature=exemplar-storage
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts:/etc/prometheus/rules:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      org.springframework.boot.ignore: "true"

  # Traces OTLP de l'application (http://localhost:4318/v1/traces), consultées dans Grafana
  tempo:
    image: grafana/tempo:3.1.1
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "4318:4318"
      - "3200:3200"
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
    tmpfs:
      - /var/tempo:mode=1777
    labels:
      org.springframework.boot.ignore: "true"

  # Logs OTLP de l'application (http://localhost:3100/otlp/v1/logs), corrélés aux traces par trace_id
  loki:
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
    tmpfs:
      - /loki:mode=1777
    labels:
      org.springframework.boot.ignore: "true"

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - tempo
      - loki
    labels:
      org.springframework.boot.ignore: "true"

volumes:
  postgres-data:
