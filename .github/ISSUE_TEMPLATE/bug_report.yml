name: Bug
description: Signaler un comportement incorrect
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que se passe-t-il ?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Aller sur ...
        2. Cliquer sur ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Zone
      options: [Backend, Frontend, Paiement, Infra, CI/CD, Observabilité]
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environnement
      options: [local, staging, production]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / traceId
      description: Ne jamais coller de données personnelles ni de secrets.
      render: text
