version: 2

updates:
  - package-ecosystem: maven
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build(deps)"
    groups:
      spring:
        patterns: ["org.springframework*"]
      maven-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]

