version: 2

updates:
  - package-ecosystem: maven
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build(deps)"
    groups:
      spring:
        patterns: ["org.springframework*"]
      maven-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Doit suivre l'API OpenTelemetry de Spring Boot (cf. pom.xml) : seuls les correctifs sont sûrs, le reste se
      # monte avec Spring Boot
      - dependency-name: io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0
        update-types: [version-update:semver-minor, version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build(deps)"
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "@schematics/angular", "angular-eslint", "@angular-eslint/*"]
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Angular 22 (@angular/build) n'accepte pas TypeScript 7 : monter avec Angular, qui fixe sa propre plage
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: docker-compose
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build(deps)"

  # À activer quand infra/ contiendra des fichiers .tf :
  #
  # - package-ecosystem: terraform   # lit les fichiers .tf d'OpenTofu
  #   directories: ["/infra/envs/*", "/infra/modules/*", "/infra/bootstrap"]
