# Tempo local, mono-processus, traces gardées en mémoire (tmpfs) le temps de la session.
# En AWS, les traces passent par le collecteur ADOT vers X-Ray (cf. docs/TECHNICAL.md).
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

compactor:
  compaction:
    block_retention: 24h
