# Loki local, mono-processus, logs gardés en mémoire (tmpfs) le temps de la session.
# Ingestion OTLP native : http://localhost:3100/otlp/v1/logs. En AWS, les logs vont dans CloudWatch Logs.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # trace_id, span_id… des logs OTLP sont stockés en métadonnées structurées
  allow_structured_metadata: true

pattern_ingester:
  enabled: false
