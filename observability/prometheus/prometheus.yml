# Configuration Prometheus locale. En AWS, le collecteur ADOT scrape l'application
# et écrit dans Amazon Managed Prometheus (cf. docs/TECHNICAL.md).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: ecom
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
